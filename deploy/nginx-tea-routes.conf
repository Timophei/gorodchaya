# Чайный город: красивые и короткие ссылки на чай.
# Подключается в server-блок gorodchaya.ru строкой
#   include snippets/chaygorod-tea-routes.conf;
# (это делают install.sh и update.sh).

# /tea/<адрес> -> файл tea/<адрес>.html, который печёт генератор.
# Нет такого файла (адрес сменили или чай удалили) — спрашиваем бэкенд:
# он перенаправит со старого адреса на новый или покажет «чай не найден».
location ^~ /tea/ {
    try_files $uri.html @chaygorod_tea_go;
}
location @chaygorod_tea_go {
    rewrite ^/tea/([^/]+?)/?$ /go/slug/$1 break;
    proxy_pass http://127.0.0.1:4000;
}

# Короткая ссылка для QR: /t/<номер> -> 301 на /tea/<адрес>.
location ~ "^/t/([0-9]{1,9})/?$" {
    proxy_pass http://127.0.0.1:4000/go/t/$1;
}

# Старые адреса tea-<id>.html (до красивых ссылок) -> 301 на новые.
location ~ ^/tea-([A-Za-z0-9_-]+)\.html$ {
    proxy_pass http://127.0.0.1:4000/go/id/$1;
}
