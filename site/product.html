<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Товар — Чайный город</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--
  Совместимость со старыми ссылками вида product.html?id=... Настоящая,
  индексируемая страница товара теперь генерируется заранее и лежит в
  tea-<id>.html (см. tools/generate-tea-pages.mjs) — там же весь контент
  сразу в HTML, а не только после fetch. Каталог и главная ссылаются уже
  на неё напрямую, а этот файл только подстраховывает старые ссылки.
-->
<main class="wrap container-pad" style="padding:60px 0;text-align:center;">
  <div class="state-msg loading">Переходим к товару…</div>
</main>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  if (id) {
    location.replace('tea-' + encodeURIComponent(id) + '.html');
  } else {
    location.replace('catalog.html');
  }
})();
</script>
</body>
</html>
